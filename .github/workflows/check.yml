name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Skills consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm run check
        run: node scripts/check-skills.mjs
      - name: Plugin version in sync
        run: node scripts/sync-plugin-version.mjs --check
